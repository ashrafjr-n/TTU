<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>lottie measure harness</title>
<style>
  body { margin: 0; background: #efeae3; }
  /* replicates the widget button: .support-fab w-14 h-14 rounded-full flex items-center justify-center */
  .fab { display: flex; align-items: center; justify-content: center; border-radius: 9999px; }
  .mount { display: block; width: 100%; height: 100%; }
  .support-widget-lottie-svg { overflow: visible !important; transform-origin: center; }
  .case { margin: 40px; }
  .label { font: 12px monospace; margin-bottom: 6px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie_light.min.js"></script>
</head>
<body>
<div id="cases"></div>
<script>
// [container px, css scale]
const CASES = [[56, 2.2], [56, 2.8], [56, 5.0], [80, 2.8], [80, 3.4], [80, 4.0], [88, 3.6], [96, 3.2], [96, 3.6]];
const root = document.getElementById('cases');
window.measured = [];

CASES.forEach(([size, scale], i) => {
  const wrap = document.createElement('div');
  wrap.className = 'case';
  wrap.innerHTML = '<div class="label">container ' + size + 'px / scale(' + scale + ')</div>';
  const fab = document.createElement('div');
  fab.className = 'fab';
  fab.style.width = size + 'px';
  fab.style.height = size + 'px';
  const mount = document.createElement('span');
  mount.className = 'mount';
  mount.id = 'mount-' + i;
  fab.appendChild(mount);
  wrap.appendChild(fab);
  root.appendChild(wrap);

  const anim = lottie.loadAnimation({
    container: mount,
    renderer: 'svg',
    loop: true,
    autoplay: true,
    path: '/animation/AI-chatbot.json',
    rendererSettings: {
      preserveAspectRatio: 'xMidYMid meet',
      className: 'support-widget-lottie-svg',
    },
  });

  anim.addEventListener('DOMLoaded', () => {
    const svg = mount.querySelector('svg');
    svg.style.transform = 'scale(' + scale + ')';
    requestAnimationFrame(() => {
      const bb = svg.getBBox();
      const ctm = svg.getScreenCTM();
      const pt = (x, y) => { const p = svg.createSVGPoint(); p.x = x; p.y = y; return p.matrixTransform(ctm); };
      const p1 = pt(bb.x, bb.y), p2 = pt(bb.x + bb.width, bb.y + bb.height);
      window.measured.push({
        container: size,
        scale: scale,
        contentUserUnits: { w: +bb.width.toFixed(1), h: +bb.height.toFixed(1) },
        renderedPx: { w: +(p2.x - p1.x).toFixed(1), h: +(p2.y - p1.y).toFixed(1) },
      });
    });
  });
});
</script>
</body>
</html>
