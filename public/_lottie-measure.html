<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>lottie measure harness</title>
<link rel="stylesheet" href="/build/assets/app-Ch70hu8r.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie_light.min.js"></script>
<style>
  body { background: #efeae3; margin: 0; min-height: 200vh; }
  .marker { position: fixed; bottom: 0; left: 0; right: 0; height: 1px; background: rgba(255,0,0,.5); }
</style>
</head>
<body class="font-body bg-ttu-cream text-ttu-black antialiased">

<!-- exact markup of the real widget's toggle button -->
<div id="support-widget" class="fixed bottom-5 right-5 z-[200]">
  <button type="button" id="support-widget-toggle"
          aria-expanded="false"
          class="support-fab rounded-full text-white flex items-center justify-center ms-auto">
    <span id="support-widget-icon-open" class="block w-full h-full">
      <span id="support-widget-lottie" class="support-widget-lottie-mount block w-full h-full" aria-hidden="true"></span>
      <svg id="support-widget-icon-fallback" class="hidden w-6 h-6 m-auto" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.556 0 8.25-3.19 8.25-7.125S16.556 6 12 6s-8.25 3.19-8.25 7.125c0 1.85.816 3.535 2.153 4.8.09.653-.132 1.503-.51 2.19-.203.371.023.865.44.803a7.87 7.87 0 003.037-1.242A9.66 9.66 0 0012 20.25z" />
      </svg>
    </span>
    <svg id="support-widget-icon-close" class="hidden w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
</div>
<div class="marker"></div>

<script>
const mount = document.getElementById('support-widget-lottie');
const anim = lottie.loadAnimation({
  container: mount,
  renderer: 'svg',
  loop: true,
  autoplay: true,
  path: '/animation/AI-chatbot.json',
  rendererSettings: { preserveAspectRatio: 'xMidYMid meet', className: 'support-widget-lottie-svg' },
});

window.measureNow = function () {
  const btn = document.getElementById('support-widget-toggle');
  const svg = mount.querySelector('svg');
  const br = btn.getBoundingClientRect();
  const bb = svg.getBBox();
  const ctm = svg.getScreenCTM();
  const pt = (x, y) => { const p = svg.createSVGPoint(); p.x = x; p.y = y; return p.matrixTransform(ctm); };
  const p1 = pt(bb.x, bb.y), p2 = pt(bb.x + bb.width, bb.y + bb.height);
  return {
    buttonPx: +br.width.toFixed(1) + ' x ' + +br.height.toFixed(1),
    robotPx: +(p2.x - p1.x).toFixed(1) + ' x ' + +(p2.y - p1.y).toFixed(1),
    robotBottomGapFromViewport: +(innerHeight - p2.y).toFixed(1),
    robotRightGapFromViewport: +(innerWidth - p2.x).toFixed(1),
    computedTransform: getComputedStyle(svg).transform,
  };
};
// simulate the open state exactly as setOpen() does
window.setOpenState = function (open) {
  const btn = document.getElementById('support-widget-toggle');
  document.getElementById('support-widget-icon-open').classList.toggle('hidden', open);
  document.getElementById('support-widget-icon-close').classList.toggle('hidden', !open);
  btn.classList.toggle('neu-fab', open);
  btn.classList.toggle('bg-ttu-red-dark', open);
  btn.classList.toggle('support-fab--compact', open);
  return window.measureNow().buttonPx;
};
</script>
</body>
</html>
